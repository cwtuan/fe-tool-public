name: npmPrefetchImageGen

on:
  # push:
  #   branches:
  #     - master
  workflow_dispatch:

  schedule:
    - cron:  '0 17 * * *'

permissions:
  contents: read

jobs:
  npmPrefetchImageGen:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Step 1
      - name: Checkout public repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      # Step 2
      - name: Clone fe-tool
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          gh repo clone cwtuan/fe-tool private-repo -- --depth 1 > /dev/null 2>&1
          rm -rf private-repo/.git

      # Step 3
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      # Step 4
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: private-repo/pnpm-lock.yaml


      - name: Install canvas dependencies
        run: |
          sudo apt-get update  > /dev/null 2>&1
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev   > /dev/null 2>&1


      # Step 5
      - name: Install dependencies
        working-directory: private-repo
        run: pnpm install  > /dev/null 2>&1

      # Step 6
      - name: Rebuild canvas with npm (pnpm to skip building canvas in pnpm-workspace.yaml)
        working-directory: private-repo
        run: npm rebuild canvas   > /dev/null 2>&1


      - name: npmPrefetchImageGen
        working-directory: private-repo
        run: node tool/npmPrefetchImageGen.js  > /dev/null 2>&1

      # Step 7
      - name: Cleanup
        if: always()
        run: |
          rm -rf private-repo
